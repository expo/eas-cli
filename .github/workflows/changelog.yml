name: Changeset PR check

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
      - unlabeled

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-changeset:
    name: Check for a changeset
    runs-on: ubuntu-latest
    env:
      # Dependabot PRs only update dependencies, so they need no changeset.
      SKIP_CHECK: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'no changelog') ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        }}
      BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The "no changelog" label does not skip this step.
      - name: Fail if a CHANGELOG.md file was edited
        run: |
          edited="$(git diff --name-only "$BASE_REF...HEAD" | grep -E '(^|/)CHANGELOG\.md$' || true)"
          if [ -n "$edited" ]; then
            echo "::error::Do not edit CHANGELOG.md files. The release generates them from changesets. Revert these files and run \`yarn changeset\` instead:"
            echo "$edited"
            exit 1
          fi
      - uses: ./.github/actions/setup-mise
        if: env.SKIP_CHECK != 'true'
      - name: Install script dependencies
        if: env.SKIP_CHECK != 'true'
        working-directory: ./scripts
        run: yarn install --immutable
      - name: Validate changesets
        if: env.SKIP_CHECK != 'true'
        working-directory: ./scripts
        run: yarn validate-changesets "$BASE_REF"
      - uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          message-id: changelog-entry-check
          refresh-message-position: true
          message: ${{ env.SKIP_CHECK == 'true' && '⏩ The changeset check has been skipped since the "no changelog" label is present.' || '✅ Thank you for adding a changeset!' }}
          message-failure: |
            ❌ This PR needs a valid changeset. Run `yarn changeset`, select the changed packages and the bump type, and commit the new file in `.changeset/`. Do not edit `CHANGELOG.md`: the release generates it. The "Validate changesets" step log lists the problems.
            ⏩ If this PR doesn't require a changelog entry, such as if it's an internal change that doesn't affect the user experience, you can add the "no changelog" label to the PR. The label does not allow edits to `CHANGELOG.md` files.
