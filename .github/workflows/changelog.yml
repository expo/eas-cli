name: Changeset PR check

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-changeset:
    name: Check for a changeset
    runs-on: ubuntu-latest
    env:
      # These PRs need no changeset, but any supplied changesets must still be valid.
      SKIP_CHECK: >-
        ${{
          contains(github.event.pull_request.labels.*.name, 'no changelog') ||
          github.event.pull_request.user.login == 'dependabot[bot]'
        }}
      BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
      - name: Install script dependencies
        working-directory: ./scripts
        run: yarn install --immutable
      - name: Validate changesets
        working-directory: ./scripts
        run: |
          if [ "$SKIP_CHECK" = 'true' ]; then
            yarn validate-changesets "$BASE_REF" --allow-no-changeset
          else
            yarn validate-changesets "$BASE_REF"
          fi
      - uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        if: >-
          always() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        with:
          message-id: changelog-entry-check
          refresh-message-position: true
          message: ${{ env.SKIP_CHECK == 'true' && '✅ Changeset validation passed. No new changeset is required.' || '✅ Thank you for adding a changeset!' }}
          message-failure: |
            ❌ Changeset validation failed. Each changeset body must contain exactly one nonempty line. Run `yarn changeset` to add an entry. Do not edit generated changelog text; only blank-line repairs are allowed. The "Validate changesets" step log lists the problems.
            ⏩ If this PR doesn't require a changelog entry, add the "no changelog" label. Supplied changesets and generated changelog text are still checked.
