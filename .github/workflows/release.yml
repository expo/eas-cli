on:
  push:
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

name: Release workflow

jobs:
  release:
    name: Create a release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - id: create_release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: true
  publish-to-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: release
    permissions:
      id-token: write
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-mise
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build
      - name: Publish packages to npm
        run: yarn run -T lerna publish from-package --yes --no-verify-access
      # Read the version from the eas-cli package, not lerna.json. Lerna bumps
      # only changed packages, so a release can carry a lerna.json version that
      # eas-cli never published (example: v21.5.1 shipped eas-cli@21.5.0).
      - name: Resolve eas-cli version
        id: resolve-version
        run: echo "version=$(jq -r .version packages/eas-cli/package.json)" >> $GITHUB_OUTPUT
      # Remove this reminder once the build fleet resolves eas-cli through the
      # pointer packages instead of the legacy dist-tags.
      - name: Slack reminder to move legacy npm dist-tags manually
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
          SLACK_CHANNEL: eas-cli
          SLACK_COLOR: warning
          SLACK_ICON: https://github.com/expo-bot.png?size=48
          SLACK_TITLE: "Manual action needed: move legacy npm dist-tags for eas-cli@${{ steps.resolve-version.outputs.version }}"
          SLACK_MESSAGE: |
            The pointer packages are published by CI now, but the build fleet still reads the legacy dist-tags. Until the fleet migrates, run:
            ```
            npm dist-tag add eas-cli@${{ steps.resolve-version.outputs.version }} latest-eas-build-staging
            npm dist-tag add eas-cli@${{ steps.resolve-version.outputs.version }} latest-eas-build
            ```
          SLACK_USERNAME: "EAS CLI CI"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_FOOTER: ""
  publish-staging-eas-cli-pointer:
    name: Publish staging eas-cli pointer
    needs: publish-to-npm
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-eas-cli-pointer.yml
    with:
      version: ${{ needs.publish-to-npm.outputs.version }}
      target: staging
  system-tests:
    name: Run system tests against staging
    needs: publish-staging-eas-cli-pointer
    uses: ./.github/workflows/worker-system-tests.yml
    secrets: inherit
  publish-production-eas-cli-pointer:
    name: Publish production eas-cli pointer
    needs:
      - publish-to-npm
      - system-tests
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-eas-cli-pointer.yml
    with:
      version: ${{ needs.publish-to-npm.outputs.version }}
      target: production
  release-changelog:
    name: Update changelog and publish release
    runs-on: ubuntu-latest
    needs: publish-to-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.EXPO_BOT_PAT }}
      - uses: ./.github/actions/setup-mise
      - name: Install dependencies
        working-directory: ./scripts
        run: yarn install --immutable
      - name: Resolve version
        run: echo "EAS_CLI_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Update changelog
        working-directory: ./scripts
        run: yarn release-changelog $EAS_CLI_VERSION > /tmp/current-changelog
      - name: Publish release
        run: gh release edit v$EAS_CLI_VERSION --draft=false -F /tmp/current-changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push
        run: |
          git fetch
          git checkout main
          git config --global user.email "support+ci@expo.io"
          git config --global user.name "Expo CI"
          git add CHANGELOG.md
          git commit --allow-empty -m "update CHANGELOG.md"
          git push
      - name: Prepare changelog for Slack
        run: |
          tail -n +3 /tmp/current-changelog > /tmp/changelog.md
          npx slackmd /tmp/changelog.md
          echo 'SLACK_CHANGELOG<<EOF' >> $GITHUB_ENV
          cat /tmp/changelog.slack.md >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
          SLACK_CHANNEL: eas-cli
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://github.com/expo-bot.png?size=48
          SLACK_TITLE: "Released eas-cli@${{ env.EAS_CLI_VERSION }}"
          SLACK_MESSAGE: ${{ env.SLACK_CHANGELOG }}
          SLACK_USERNAME: "EAS CLI CI"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_FOOTER: ""
