name: AI code review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Comment-only: needs to read the repo and write PR comments (issue comments API).
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  # The reviewer is the published @expo/code-review-cli package, run via npx — the
  # repo only carries the `.expo-code-review/` config, not the engine source.
  # Override with a repo variable ECR_VERSION to pin/bump; defaults to 0.10.x
  # (the claude-code engine the anthropic/… models below run on).
  ECR_VERSION: ${{ vars.ECR_VERSION || '^0.10.0' }}

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Continuous mode is configured by LABELS (declarative, visible, survives
    # pushes). One-off runs are done via the `/review` comment command instead.
    #   ai-review           -> auto-review every push; router picks the agents
    #   ai-review:all        -> auto-review with every agent
    #   ai-review:<agent>    -> auto-review with only those agents (e.g. ai-review:security)
    #   ai-review:skip       -> never auto-review this PR (opt-out)
    # Coarse gate: only spin up when some `ai-review*` label is present; the resolve
    # step below decides the exact agents (and honors :skip).
    if: contains(join(github.event.pull_request.labels.*.name, ','), 'ai-review')
    # Backstop so a stalled review fails fast instead of hanging toward the 6h
    # default. This is the ONE cap with no soft-landing (GitHub hard-kills the job),
    # so keep comfortable margin over the worst-case internal chain: the passes
    # budget (PASSES_BUDGET_MS, 32m — includes subdivision/fallback waves) +
    # coordinator cap (10m) + verification + CI setup. Keep in sync with the caps in
    # review.ts / coordinator.ts.
    timeout-minutes: 60
    # A reviewer failure must never fail the PR's checks in phase 1.
    continue-on-error: true
    steps:
      - name: Resolve agents from labels
        id: resolve
        env:
          # JSON array of label names, via env so a label can't inject shell.
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          names=$(printf '%s' "$LABELS" | jq -r '.[]')
          # ai-review:skip is a hard opt-out.
          if printf '%s\n' "$names" | grep -qx 'ai-review:skip'; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          has_any=false; all=false; scoped=""
          while IFS= read -r name; do
            case "$name" in
              ai-review) has_any=true ;;
              ai-review:all) has_any=true; all=true ;;
              ai-review:*) has_any=true; scoped="$scoped,${name#ai-review:}" ;;
            esac
          done <<< "$names"
          if [ "$has_any" != true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          agents=""; route=false
          if [ "$all" = true ]; then
            : # no --agents, no --route => every agent
          elif [ -n "$scoped" ]; then
            # Sanitize to keep the value shell-safe; strip the leading comma.
            agents=$(printf '%s' "${scoped#,}" | tr -cd 'a-zA-Z0-9,_-')
          else
            route=true # bare `ai-review` => let the router pick
          fi
          {
            echo "run=true"
            echo "agents=$agents"
            echo "route=$route"
          } >> "$GITHUB_OUTPUT"

      # SECURITY: check out the PR's immutable BASE commit, never the PR head or
      # merge ref — everything on this runner's disk comes from a commit that
      # already merged. `ecr ci` (0.6.0+) additionally enforces this itself: it
      # materializes the base commit via the GitHub API for configuration and the
      # head commit (OID-pinned, scrubbed of ambient runtime config like
      # opencode.json/plugins/AGENTS.md/.env) for source reads. persist-credentials
      # off — the CLI's git fetches authenticate through `gh` from GH_TOKEN, so the
      # token never lands in .git/config.
      - name: Checkout (base commit only — never the PR head)
        if: steps.resolve.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The diff comes from the API (`gh pr diff`), so a shallow checkout is enough.
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      # eas-cli pins yarn@4 via package.json "packageManager", so actions/setup-node's
      # environment probe runs `yarn` and the global yarn 1.x refuses unless corepack
      # is enabled. We don't use yarn here (the reviewer runs via npx) — this just
      # keeps setup-node's probe from erroring.
      - name: Enable Corepack
        if: steps.resolve.outputs.run == 'true'
        run: corepack enable

      - name: Set up Node
        if: steps.resolve.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # We install nothing with yarn (the reviewer runs via npx), so disable
          # setup-node's automatic package-manager cache — otherwise its post step
          # tries to save an empty yarn cache and errors ("path(s) ... do not exist").
          package-manager-cache: false

      # Unblocked CLI — the installer downloads a checksum-verified glibc-Linux
      # binary to ~/.unblocked/bin, which we put on PATH for the later steps.
      # Auth is headless via UNBLOCKED_API_TOKEN on the run step (see
      # https://docs.getunblocked.com/unblocked-cli/cli-auth#headless-authentication),
      # so no `unblocked auth` here. Non-fatal: the reviewer runs fine without it.
      - name: Install Unblocked CLI
        if: steps.resolve.outputs.run == 'true'
        continue-on-error: true
        run: |
          curl -fsSL https://getunblocked.com/install.sh | bash
          echo "$HOME/.unblocked/bin" >> "$GITHUB_PATH"

      # The anthropic/… models in .expo-code-review/config.jsonc run through the
      # Claude Code CLI (the claude-code engine). Pinned exactly — an unpinned
      # CLI would silently drift on every CI run; bump it deliberately (mirrors
      # expo/code-review-cli's own workflow).
      - name: Install Claude Code CLI
        if: steps.resolve.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.212

      # SECURITY: the TRUSTED BASE checkout above includes .expo-code-review/
      # config.jsonc, whose auth.tokenEnv names the env var the CLI forwards as the
      # model credential. `ecr verify-config` is the canonical guard (ships with the
      # CLI): it sweeps every config (root + routing + all scopes, referenced or
      # not) with the engine's real JSONC parser and refuses unless tokenEnv appears
      # exactly once, in a ROOT-owned file, equal to ECR_EXPECTED_TOKEN_ENV — so a
      # config change can't repoint it at another runner secret or sneak in a
      # JSON-escaped key. Layer 2; layer 1 is the same runtime lock inside `ecr ci`.
      - name: Guard config tokenEnv (root + routing + all scopes)
        if: steps.resolve.outputs.run == 'true'
        env:
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_REVIEW_SHARED_API_TOKEN' }}
        run: npx --yes -p "@expo/code-review-cli@$ECR_VERSION" ecr verify-config

      - name: Run AI review
        if: steps.resolve.outputs.run == 'true'
        # npx installs @expo/code-review-cli and its deps (incl. the `opencode`
        # binary the SDK spawns) into a temp prefix and runs the `ecr`/`ci` bin
        # with that prefix's node_modules/.bin on PATH.
        continue-on-error: true
        env:
          # GitHub token scoped by the permissions block above (PR comments only).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Shared Anthropic review credential (auth.providers.anthropic in
          # .expo-code-review/config.jsonc reads this env var). The claude-code
          # engine forwards it to the Claude Code CLI as the only credential —
          # an `sk-ant-oat…` setup-token or an `sk-ant-api…` Console key both work.
          CLAUDE_CODE_REVIEW_SHARED_API_TOKEN: ${{ secrets.CLAUDE_CODE_REVIEW_SHARED_API_TOKEN }}
          # Layer-1 runtime auth lock (mirrors the guard step): the CLI refuses to
          # run when the tokenEnv the loaded config honors differs from this.
          ECR_EXPECTED_TOKEN_ENV: ${{ vars.ECR_EXPECTED_TOKEN_ENV || 'CLAUDE_CODE_REVIEW_SHARED_API_TOKEN' }}
          # Unblocked CLI headless auth (PAT or team access token). Absent =>
          # the CLI stays unauthenticated; the review still runs.
          UNBLOCKED_API_TOKEN: ${{ secrets.UNBLOCKED_API_TOKEN }}
          # Optional: override the model used by every agent.
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          AGENTS: ${{ steps.resolve.outputs.agents }}
          ROUTE: ${{ steps.resolve.outputs.route }}
        run: |
          ARGS=()
          if [ -n "$AGENTS" ]; then
            ARGS=(--agents "$AGENTS")
          elif [ "$ROUTE" = "true" ]; then
            ARGS=(--route)
          fi
          npx --yes -p "@expo/code-review-cli@$ECR_VERSION" ecr ci "${ARGS[@]}"

      # Persist the run log (decision, per-agent cost, duration, token/cache
      # metrics) so cost/latency/cache reuse are observable over time — CI is
      # otherwise ephemeral and we fly blind. `always()` so a timed-out/failed run
      # still uploads whatever it logged (that's when the data matters most).
      - name: Upload review run log
        if: always() && steps.resolve.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-run-log-pr${{ github.event.pull_request.number }}
          path: .expo-code-review/.runs/reviews.jsonl
          if-no-files-found: ignore
          retention-days: 14
