name: Build Android worker for manual testing
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Build a Linux artifact for manual staging testing; does not deploy
        type: choice
        options:
          - staging
        default: staging
        required: true
permissions:
  contents: read
jobs:
  build-android-staging-test:
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
      - uses: ./.github/actions/setup-mise
      - run: yarn install --immutable
      - name: Package Linux worker from this checkout
        env:
          OUTPUT_DIR: ${{ runner.temp }}/android-worker-staging-test
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          bash packages/worker/package.sh "$OUTPUT_DIR/worker-android.tar.gz" android
          tar -xOf "$OUTPUT_DIR/worker-android.tar.gz" ./packages/build-tools/dist/steps/utils/androidEmulatorLogs.js > "$OUTPUT_DIR/androidEmulatorLogs.js"
          cd "$OUTPUT_DIR"
          sha256sum worker-android.tar.gz androidEmulatorLogs.js > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > build-revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-worker-staging-test
          path: ${{ runner.temp }}/android-worker-staging-test/
          retention-days: 7
          if-no-files-found: error
